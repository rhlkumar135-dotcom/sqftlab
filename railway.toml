name = "sqftlab"
description = "sqftLab - UAE Property Intelligence Platform"

[build]
builder = "NIXPACKS"
buildCommand = "bash scripts/railway-build.sh"

[deploy]
startCommand = "bash scripts/railway-setup.sh"
healthcheckPath = "/api/sqftlab/stats"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[env]
NODE_ENV = "production"
