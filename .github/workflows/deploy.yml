name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Railway's native GitHub integration already deploys on push to main on its
      # own. This workflow is the CLI fallback and needs its own token. Missing
      # secrets used to hard-fail the job, so every push showed a red X and it was
      # impossible to tell a real deploy failure from an unconfigured workflow.
      # Report the gap and skip the remaining steps instead.
      - name: Check Railway secrets
        id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$RAILWAY_TOKEN" ] && missing="$missing RAILWAY_TOKEN"
          [ -z "$RAILWAY_SERVICE_NAME" ] && missing="$missing RAILWAY_SERVICE_NAME"
          [ -z "$RAILWAY_PROJECT_ID" ] && missing="$missing RAILWAY_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Railway CLI deploy skipped — missing repository secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions, or ignore"
            echo "this workflow and rely on Railway's native GitHub integration."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "All Railway secrets present."
          fi

      - name: Install Railway CLI
        if: steps.check.outputs.present == 'true'
        run: npm install -g @railway/cli

      - name: Deploy
        if: steps.check.outputs.present == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service "${{ secrets.RAILWAY_SERVICE_NAME }}" \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --environment "${RAILWAY_ENVIRONMENT:-production}" \
            --ci

      - name: Verify health
        if: steps.check.outputs.present == 'true'
        env:
          PUBLIC_URL: ${{ secrets.RAILWAY_PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "::notice::RAILWAY_PUBLIC_URL not set — skipping health check."
            exit 0
          fi
          # /health is the liveness endpoint server.tsx defines, and the same path
          # railway.toml uses for the deploy healthcheck. Prefer it over a data
          # route so a database hiccup doesn't read as a failed deploy.
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$PUBLIC_URL/health" || true)
            if [ "$code" = "200" ]; then
              echo "API healthy (HTTP 200)."
              exit 0
            fi
            echo "attempt $i: HTTP $code — retrying in 15s"
            sleep 15
          done
          echo "::error::Could not confirm HTTP 200 from $PUBLIC_URL/health after deploy."
          exit 1
