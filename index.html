<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sqftLab — UAE Property Data Intelligence</title>
    <!-- Declared so browsers stop probing /favicon.ico, which 404s (the QA run
         flagged it). An SVG mark keeps the bundle free of a binary asset. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="description" content="Real-time price heatmaps, AI-powered yield forecasts, deal alerts, and portfolio tracking across every community in Dubai and Abu Dhabi." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
    <!-- Leaflet's stylesheet is bundled via src/App.tsx, not loaded from a CDN:
         the map is core UI and must not depend on a third-party host. -->

    <!-- The client is built with a RELATIVE asset base (`./assets/…`) so one
         bundle works both at `/` and at `/p/<projectId>/`. That breaks any
         nested entry path: at `/auth/signin` the relative refs resolve to
         `/auth/assets/…`, the static handler falls through to the SPA shell, and
         the browser receives HTML where it expects a JS module — a blank page.
         So client routes are entered through the root path plus a hash, and this
         runs before the module script so the redirect wins the race.

         Day 16: this cost a blank page on `/deals/<id>`, and it had silently been
         breaking `/buildings/<slug>` since Day 10 — a ONE-segment path (`/cma`,
         `/deals`) is fine, because `./assets/x.js` resolves against `/`, but a
         two-segment path resolves against `/deals/`. Parameterised routes are
         rewritten to the same root+hash form rather than special-cased one at a
         time, so the next one added is covered too. -->
    <script>
      ;(function () {
        var path = location.pathname.replace(/\/+$/, '')
        if (!path || path.indexOf('/p/') === 0) return
        var routes = { '/auth/signin': '#signin', '/signin': '#signin' }
        var hash = routes[path]
        if (hash) return location.replace('/' + hash)
        // Parameterised routes: /deals/<id>, /buildings/<slug>.
        var nested = /^\/(deals|buildings)\/(.+)$/.exec(path)
        if (nested) location.replace('/#/' + nested[1] + '/' + nested[2])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
